<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Criar Novo Jogo</title>

<style>
/* Reset básico */
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body, html{
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

/* Container principal ocupando toda a página */
.container{
    display: flex;
    width: 100%;
    height: 100%;
    background: #f4f6f7;
}

/* Sidebar */
.sidebar{
    width: 220px;
    background: #2c3e50;
    color: white;
    padding: 20px;
}

.sidebar a{
    display: block;
    color: white;
    text-decoration: none;
    margin: 15px 0;
}

.sidebar a:hover{
    color: #1abc9c;
}

/* Conteúdo principal ocupa todo o espaço restante */
.main{
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Topbar */
.topbar{
    background: white;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
}

/* Área do formulário ocupa toda a tela disponível */
.content{
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Formulário ocupa grande parte da tela */
.form-card{
    background: white;
    padding: 30px;
    width: 70%;
    max-width: 600px;
    border-radius: 8px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
}

.form-card h2{
    margin-bottom: 20px;
}

label{
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, textarea{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}

textarea{
    resize: vertical;
}

.buttons{
    margin-top: 25px;
    display: flex;
    gap: 10px;
}

button{
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn-create{
    background: #2ecc71;
    color: white;
}

.btn-cancel{
    background: #e74c3c;
    color: white;
}

button:hover{
    opacity: 0.85;
}

</style>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>Menu</h2>
        <a href="#">Dashboard</a>
        <a href="#">Os seus jogos</a>
        <a href="#"><strong>Criar jogo</strong></a>
        <a href="#">Logout</a>
    </div>

    <div class="main">

        <div class="topbar">
            <div><strong>Criar Novo Jogo</strong></div>
            <div>Utilizador: joao123</div>
        </div>

        <div class="content">

            <div class="form-card">

                <h2>Novo jogo</h2>

                <form>

                    <label>Nome do jogo</label>
                    <input type="text">

                    <label>Descrição</label>
                    <textarea rows="4" placeholder="Descrição do jogo"></textarea>

                    <label>Data e hora</label>
                    <input type="datetime-local">

                    <label>Temperatura Ar condicionado (°C)</label>
                    <input type="number" placeholder="Ex: 30">

                    <label>Som fechar salas (dB)</label>
                    <input type="number" placeholder="Ex: 40">

                    <div class="buttons">
                        <button class="btn-create">Criar jogo</button>
                        <button class="btn-cancel" type="button">Cancelar</button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
