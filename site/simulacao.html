<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Painel - Os seus jogos</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
}

.sidebar{
    width:220px;
    background:#2c3e50;
    height:100vh;
    color:white;
    padding:20px;
}

.sidebar h2{
    margin-top:0;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    margin:15px 0;
}

.sidebar a:hover{
    color:#1abc9c;
}

.main{
    flex:1;
    background:#f4f6f7;
}

.topbar{
    background:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0px 2px 5px rgba(0,0,0,0.1);
}

.username{
    font-weight:bold;
}

.content{
    padding:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0px 0px 8px rgba(0,0,0,0.08);
}

th, td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#ecf0f1;
}

.status-agendado{
    color:#e67e22;
    font-weight:bold;
}

.status-concluido{
    color:#27ae60;
    font-weight:bold;
}

button{
    padding:6px 10px;
    margin-right:5px;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

.btn-edit{
    background:#3498db;
    color:white;
}

.btn-start{
    background:#2ecc71;
    color:white;
}

.btn-cancel{
    background:#e74c3c;
    color:white;
}

button:hover{
    opacity:0.85;
}

</style>

</head>

<body>

<div class="sidebar">
        <h2>Menu</h2>
        <a href="#">Dashboard</a>
        <a href="#"><strong>Os seus jogos</strong></a>
        <a href="#">Criar jogo</a>
        <a href="#">Logout</a>
    </div>

<div class="main">

    <div class="topbar">
        <div><strong>Painel</strong></div>
        <div class="username">
            Utilizador: joao123
        </div>
    </div>

    <div class="content">

        <h2>Os seus jogos</h2>

        <table>

            <tr>
                <th>Nome do jogo</th>
                <th>Descrição</th>
                <th>Data</th>
                <th>Estado</th>
                <th>Ações</th>
            </tr>

            <tr>
                <td>Simulacao 1</td>
                <td>Descricao</td>
                <td>10/04/2026 - 18:00</td>
                <td class="status-agendado">Agendado</td>
                <td>
                    <button class="btn-edit">Editar</button>
                    <button class="btn-start">Iniciar</button>
                    <button class="btn-cancel">Cancelar</button>
                </td>
            </tr>

            <tr>
                <td>Simulacao 2</td>
                <td>Descricao</td>
                <td>05/04/2026 - 20:00</td>
                <td class="status-concluido">Concluído</td>
                <td>
                    <button class="btn-edit">Editar</button>
                </td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
